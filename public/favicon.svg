<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!--
    Mismo dibujo que LogoMarca (src/components/Logo.tsx), el icono del menu:
    un pin de ubicacion recorrido por el trazo de una ruta.

    Los colores van fijos y no por tokens: el favicon lo pinta el navegador
    fuera del documento, asi que no alcanza las variables CSS de la app.
    #0377e3 es el color de acento y #ffffff el de contraste.

    Ojo al editar este comentario: XML prohibe dos guiones seguidos dentro de
    un comentario, y con ellos el navegador descarta el archivo completo.
  -->
  <rect width="40" height="40" rx="11" fill="#0377e3"/>
  <path d="M9 30c4.5 0 4.5-5 9-5s4.5 5 9 5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
  <path d="M20 8c-3.6 0-6.5 2.9-6.5 6.5 0 4.6 6.5 10.5 6.5 10.5s6.5-5.9 6.5-10.5C26.5 10.9 23.6 8 20 8Z" fill="#ffffff"/>
  <circle cx="20" cy="14.5" r="2.4" fill="#0377e3"/>
</svg>
